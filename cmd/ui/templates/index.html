{{define "content"}}
<nav class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('employees', this)">👤 Сотрудники</button>
    <button class="tab-btn"       onclick="switchTab('departments', this)">🏢 Отделы</button>
</nav>

<div id="tab-employees" class="tab-pane">
    <button class="btn-primary" style="margin-bottom:20px"
            onclick="document.getElementById('add-employee-modal').showModal()">
        + Добавить сотрудника
    </button>

    <dialog id="add-employee-modal">
        <div class="modal-header">
            <h3>Новый сотрудник</h3>
            <button class="modal-close" type="button"
                    onclick="this.closest('dialog').close()">✕</button>
        </div>
        <form hx-post="/employees"
              hx-target="#employees-table"
              hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful){this.closest('dialog').close();this.reset()}">
            <label>Имя <input name="name" type="text" required placeholder="Иван Иванов"></label>
            <label>Пол
                <select name="sex">
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </label>
            <label>Возраст <input name="age" type="number" min="1" placeholder="30"></label>
            <label>Зарплата <input name="salary" type="number" min="0" placeholder="100000"></label>
            <label>Отдел
                <select name="department_code">
                    <option value="">— нет —</option>
                    {{range .Departments}}
                    <option value="{{.Code}}">{{.Name}}</option>
                    {{end}}
                </select>
            </label>
            <div class="modal-actions">
                <button type="button" class="btn-ghost"
                        onclick="this.closest('dialog').close()">Отмена</button>
                <button type="submit" class="btn-primary">Добавить</button>
            </div>
        </form>
    </dialog>

    {{template "employees-table" .}}
</div>

<div id="tab-departments" class="tab-pane" style="display:none">
    <button class="btn-primary" style="margin-bottom:20px"
            onclick="document.getElementById('add-department-modal').showModal()">
        + Добавить отдел
    </button>

    <dialog id="add-department-modal">
        <div class="modal-header">
            <h3>Новый отдел</h3>
            <button class="modal-close" type="button"
                    onclick="this.closest('dialog').close()">✕</button>
        </div>
        <form hx-post="/departments"
              hx-target="#departments-table"
              hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful){this.closest('dialog').close();this.reset()}">
            <label>Код <input name="code" type="text" required placeholder="dev"></label>
            <label>Название <input name="name" type="text" required placeholder="Разработка"></label>
            <div class="modal-actions">
                <button type="button" class="btn-ghost"
                        onclick="this.closest('dialog').close()">Отмена</button>
                <button type="submit" class="btn-primary">Добавить</button>
            </div>
        </form>
    </dialog>

    {{template "departments-table" .}}
</div>

<script>
function switchTab(tab, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).style.display = '';
    btn.classList.add('active');
}
</script>
{{end}}
